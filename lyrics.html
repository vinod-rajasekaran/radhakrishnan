<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics - Dr. R. Radhakrishnan</title>
  <meta name="description" content="Browse 800+ Tamil devotional songs with transliteration and English translation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&family=Noto+Serif+Tamil:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=20260829b">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css?v=20260829b" integrity="sha384-FDFJN4eDoTbFzL8KHLAOmtAicPaFc44D0JrdAwgO91ZDgGmAHrcpMWLCwTxBSVI7" crossorigin="anonymous">
</head>
<body data-page="lyrics">
  <header id="site-header"></header>

  <main id="main-content" tabindex="-1">
    <div id="theme-carousel-wrap"></div>

    <div class="page-head">
      <p class="breadcrumb"><a href="index.html">Home</a> / Lyrics</p>
      <h1 class="page-title">Find a song</h1>
      <p class="page-sub">240/800 songs, searchable by title, and narrowed by theme and/or deity. Click any song to read the lyrics and translation.</p>
    </div>

    <!-- Search and Filters -->
    <div class="search-filter-bar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="search" id="search-input" class="search-input" placeholder="Search songs…" aria-label="Search songs">
      </div>

      <div class="filter-row" role="group" aria-label="Filter songs">
        <div class="filter-dd" id="dd-theme">
          <button class="filter-dd-btn" aria-haspopup="listbox" aria-expanded="false">
            Theme <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul class="filter-dd-menu" role="listbox" aria-label="Filter by theme" id="menu-theme"></ul>
        </div>
        <div class="filter-dd" id="dd-deity">
          <button class="filter-dd-btn" aria-haspopup="listbox" aria-expanded="false">
            Deity <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul class="filter-dd-menu" role="listbox" aria-label="Filter by deity" id="menu-deity"></ul>
        </div>
        <div class="filter-dd" id="dd-volume">
          <button class="filter-dd-btn" aria-haspopup="listbox" aria-expanded="false">
            Volume <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul class="filter-dd-menu" role="listbox" aria-label="Filter by volume" id="menu-volume">
            <li class="filter-option" role="option" data-value="" aria-selected="true">All volumes</li>
            <li class="filter-option" role="option" data-value="1" aria-selected="false">Volume One</li>
            <li class="filter-option" role="option" data-value="2" aria-selected="false">Volume Two</li>
            <li class="filter-option" role="option" data-value="3" aria-selected="false">Volume Three</li>
          </ul>
        </div>

        <button class="filter-clear" id="filter-clear" aria-label="Clear all filters" hidden>Clear filters</button>
      </div>

      <!-- Active chips -->
      <div class="filter-chips" id="filter-chips" aria-live="polite"></div>
    </div>

    <!-- Results count -->
    <div class="results-bar">
      <p class="results-count" id="results-count" aria-live="polite"></p>
    </div>

    <!-- Song grid -->
    <div class="song-grid" id="song-grid" role="group" aria-label="Songs"></div>

    <!-- Loading / empty states -->
    <div class="loading-state" id="loading-state" aria-live="polite" hidden>
      <span class="loading-spinner" aria-hidden="true"></span>
      Loading songs…
    </div>
    <div class="empty-state" id="empty-state" hidden>
      <p>No songs match your search. <button class="link-btn" id="clear-search">Clear and start over</button></p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.2.0/dist/fuse.min.js" integrity="sha384-fjX7DeaZ/XFhVUVbuJ4tJCCRWoC6LtyhHqvsNRsJBcfs1VksovPjnUUGM3+Ii9st" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js?v=20260829b" integrity="sha384-1r2GCX3Eml88xgbJb7kOe51vEASmv6hbqDRcK55GxMiwWy/5xX1xFlC6z7saa8Ct" crossorigin="anonymous"></script>
  <script src="assets/js/site.js?v=20260829b"></script>
  <script src="assets/js/lyrics.js?v=20260829b"></script>
</body>
</html>
